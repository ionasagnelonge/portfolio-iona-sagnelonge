<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Iona Sagnelonge — illustration, édition, didactique</title>
    <meta
      name="description"
      content="Portfolio d’Iona Sagnelonge : illustration, affiche, cartographie, volume, édition, photographie, didactique."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>

    <header class="site-header">
      <a class="site-header__name nav-word" href="#/" data-route="home">Iona Sagnelonge</a>
      <nav class="site-header__nav" aria-label="Navigation principale">
        <a class="nav-word" href="#/projets" data-route="projects">Projets</a>
        <a class="nav-word" href="#/infos" data-route="infos">Infos</a>
        <a class="nav-word" href="#/competences" data-route="competences">Compétences</a>
        <a class="nav-word" href="#/contact" data-route="contact">Contact</a>
      </nav>
    </header>

    <canvas class="sowing" aria-hidden="true"></canvas>

    <main id="main" class="view" tabindex="-1"></main>

    <footer class="site-footer">
      <span class="crawler" role="button" tabindex="0" aria-label="La chenille : cliquez pour un looping, attrapez-la pour la déplacer">
        <span class="crawler__body"></span>
      </span>
      <span class="site-footer__copy">© <span data-year></span> Iona Sagnelonge</span>
    </footer>

    <div class="scrollbar" aria-hidden="true">
      <div class="scrollbar__thumb"></div>
    </div>

    <dialog class="lightbox" aria-label="Visionneuse d’images">
      <figure class="lightbox__figure">
        <img class="lightbox__image" alt="" />
        <figcaption class="lightbox__caption"></figcaption>
      </figure>
      <button class="lightbox__close" type="button" aria-label="Fermer">×</button>
      <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Image précédente"></button>
      <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Image suivante"></button>
    </dialog>
  </body>
</html>
